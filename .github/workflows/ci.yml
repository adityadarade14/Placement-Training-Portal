
name: Placement Portal CI

on:
  push:
    branches: [main, devops-upgrade]
  pull_request:
    branches: [main, devops-upgrade]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Tests
        run: npm test

      - name: Check Backend Syntax
        run: node --check Backend/server.js

      - name: Check Frontend Syntax
        run: node --check Frontend/script.js
